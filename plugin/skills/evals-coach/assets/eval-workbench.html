const CALIBRATION_TEMPLATE = "Before any of these scores gates a release: hand-label 20-30 runs yourself, deliberately mixed, clear passes, clear failures, boundary cases, adversarial inputs, and cases where the evidence simply isn't there. Run the judge over the same set and compare. Report false passes and false failures separately; an overall accuracy figure hides the one that matters. Where you disagree with the judge, fix the criterion, the evidence it's given, or your own label before you touch the threshold. Route anything still contested to human review.";

function localJudge(c){
  return [
    "You are grading one specific criterion for [feature name]. Judge only this criterion. Ignore everything else about the output.",
    "",
    "CRITERION",
    c.text,
    "",
    "WHAT YOU ARE GIVEN",
    "- The user's request: [what the system received]",
    "- The system's output: [what it produced]",
    "- [Any source material the output was supposed to rely on]",
    "You may judge only what appears above. If something you would need is missing, that is insufficient_evidence, not a fail.",
    "",
    "PASS",
    "[State plainly what a passing output does. Then one borderline example that still passes, and why.]",
    "",
    "FAIL",
    "[State plainly what a failing output does. Then one borderline example that fails, and why.]",
    "",
    "OUTPUT",
    'Reply with only JSON: {"verdict": "pass" | "fail" | "insufficient_evidence", "evidence": "<the exact words from the output that decided it>", "reason": "<one sentence>"}',
    "Do not reward length, confidence or tone. Do not guess at intent."
  ].join("\n");
}

function draftGraders(host){
  withBusy(host, "Choosing graders and writing judge prompts…", async ()=>{
    const crits = allCriteria();
    const r = await ask(HOUSE + `

` + ctxBlock() + `

For each criterion below, choose the CHEAPEST RELIABLE grader and say what evidence it must be able to observe.
Criteria (use these exact ids):
` + crits.map(c=>`${c.id} [${c.kind}] ${c.text}`).join("\n") + `

Grader types: "code" (deterministic check on output or state), "trace" (a required or prohibited observable action), "llm" (an LLM judge), "human" (review).
Prefer code, then trace, then llm, then human. Critical must-not criteria are hard gates, never averaged.

Then write a judge prompt for EACH criterion you assigned to "llm". A judge prompt must: state the one thing being judged in this product's language; list exactly what evidence it is given; give a pass definition and a fail definition with a boundary example each; require a verdict of pass, fail or insufficient_evidence; and forbid judging anything it cannot see.

Then write a short calibration plan (3-5 sentences) for this specific feature: what mixed set of examples to label by hand, how to compare, and what to do about disagreements. Mention reporting false passes and false failures separately.

Reply with only JSON:
{"graders":[{"id":"c123","type":"llm","evidence":"..."}],
 "judges":[{"id":"c123","name":"Judge: <criterion in 5 words>","prompt":"..."}],
 "calibration":"..."}`);
    (r.graders||[]).forEach(g=>{ if(g && g.id) S.graders[g.id] = {type: ["code","trace","llm","human"].includes(g.type)?g.type:"llm", evidence:String(g.evidence||"")}; });
    S.judges = (r.judges||[]).map(j=>({id:j.id, name:String(j.name||"Judge"), prompt:String(j.prompt||"")}));
    S.calibration = String(r.calibration||"");
    S.gradersDrafted = true;
  });
}

/* ---- step 6: gate ---- */
function stepGate(body){
  $("#p-lede").textContent = sample
    ? "The contract that turns a run into a decision. Set your risk tolerance and Claude proposes the rest, but the thresholds are yours."
    : "The contract that turns a run into a decision. Nobody can set these for you: they're a statement of what you're willing to ship.";
  const host = busyHost();
  const wrap = el("div",{class:"stack"});
  const G = S.gate;

  const exp = el("details",{class:"explainer"});
  exp.appendChild(el("summary",{text:"What's a release gate, and what do I write in these boxes?"}));
  const eb = el("div",{class:"explainer-body"});
  eb.appendChild(el("p",{text:"A release gate is the rule you agree to in advance for turning a set of results into a decision: ship, don't ship, or needs a human look. Six boxes, and you are writing sentences, not filling in a form. Anyone reading it later should be able to apply it without asking you what you meant."}));
  eb.appendChild(el("p",{text:"The reason you write it now, before you have seen any numbers, is that it is remarkably easy to talk yourself into shipping when you are two points short and the launch is on Thursday. A gate written in advance is the thing you argue with, rather than the thing you quietly adjust."}));
  eb.appendChild(el("div",{class:"explainer-item"},[
    el("strong",{text:"Say it as a sentence, not a score"}),
    el("span",{text:"\"90%\" on its own is not usable: 90% of what, counted how? \"At least 90% of the 12 cases pass every must criterion\" is a rule someone can actually apply six months from now."})
  ]));
  eb.appendChild(el("div",{class:"explainer-item"},[
    el("strong",{text:"Never let an average absorb a disaster"}),
    el("span",{text:"If one group of requests fails badly but the overall number still looks fine, the average has hidden it. That is what the second and third boxes are for: groups that must hold up on their own, and failures that stop the release no matter what the score says."})
  ]));
  eb.appendChild(el("div",{class:"explainer-item"},[
    el("strong",{text:"Blank is a legitimate answer"}),
    el("span",{text:"If nothing needs its own floor, leave that box empty. A short gate you will actually enforce beats a thorough one nobody follows."})
  ]));
  eb.appendChild(el("p",{class:"hint",text: sample ? "Every box has an example in it. If you would rather start from a draft, use the button below and then edit it; the numbers are a product judgement and they should be yours." : "Every box has an example in it showing the shape of a good answer. Replace it with your own."}));
  exp.appendChild(eb);
  wrap.appendChild(exp);

  wrap.appendChild(pick("How much risk can this feature carry?", "Drives how strict the proposed thresholds are.", [
    ["low","Low, it's reversible","Internal, easily undone"],
    ["medium","Medium","User-visible, correctable"],
    ["high","High, mistakes stick","Money, policy, or trust on the line"]
  ], G.risk, v=>{ G.risk=v; save(); }));

  if(sample) wrap.appendChild(el("div",{class:"btnrow"},[
    el("button",{class:"btn " + (S.gateDrafted?"sm ghost":"primary"), onclick:()=>draftGate(host)},[S.gateDrafted?"Redraft the gate":"Propose the release gate"])
  ]));
  wrap.appendChild(host);

  const nCases = S.cases.length || 12;
  const firstBlocker = (S.criteria.mustNot.find(c=>c.on!==false && c.text.trim())||{}).text || "";
  const rows = [
    ["overall","The bar for the whole run",
      "A number, plus what it is counted over. Say it as a sentence so nobody has to guess later.",
      "e.g. At least 90% of the " + nCases + " cases pass every must criterion."],
    ["floors","Groups that must hold up on their own",
      "An average across everything can hide one kind of request being badly broken. Name any group you would not accept hiding inside the overall number. Leave blank if none.",
      "e.g. Refund questions must pass at least 8 of their 10 cases on their own, not just inside the overall average."],
    ["blockers","Things that block the release outright",
      "One per line. A single occurrence stops the release however good the rest of the numbers look. Usually these are your must-not criteria.",
      firstBlocker ? ("e.g. " + firstBlocker + "\nAny case where the system acts without the evidence it needs.")
                   : "e.g. Any reply that states a policy we do not have.\nAny reply that promises a specific refund amount."],
    ["regression","What may get worse",
      "Measured against whatever you are running today. \"Nothing\" is a perfectly good answer.",
      "e.g. No case that passes today may start failing. Up to 500ms slower is acceptable."],
    ["reps","How many times you run each case",
      "The same input can give a different answer on a second run. Decide which question you are asking: can it do this at all (one pass out of several runs is enough), or can it do this reliably (every run must pass)? For anything a user depends on, you want the second.",
      "e.g. 3 runs per case. A case counts as a pass only if all 3 pass."],
    ["owner","Who owns the decision",
      "One named role, so there is someone to ask when the result is borderline.",
      "e.g. The PM for the support inbox. Not \"the team\"."]
  ];
  rows.forEach(([k,label,hint,ph])=>{
    wrap.appendChild(field(label, hint, area(G[k], v=>{G[k]=v;markStale();}, k==="blockers"?3:2, ph), G[k]&&G[k].trim() ? (S.gateDrafted?"drafted":null) : "you"));
  });

  body.appendChild(wrap);
  const filled = rows.filter(([k])=>G[k]&&G[k].trim()).length;
  $("#p-note").textContent = filled + " of " + rows.length + " set";
  if(filled>0) S.gateDrafted = true;
}
function draftGate(host){
  withBusy(host, "Proposing a release contract…", async ()=>{
    const risk = {low:"low, the feature is reversible and internal", medium:"medium, user-visible but correctable", high:"high, mistakes are costly and stick"}[S.gate.risk];
    const r = await ask(HOUSE + `

` + ctxBlock() + `

The PM's risk tolerance is ${risk}.
Propose a release contract. Be concrete and numeric where a number is legitimate; where averaging would hide something, say so instead of inventing a score.
Fields:
  overall: minimum overall performance, naming what is measured over which cases
  floors: floors for the specific user or task slices in this eval
  blockers: the zero-tolerance failures, one per line, drawn from the must-not criteria
  regression: what regression against the baseline is permitted, if any
  reps: how many repetitions per case and why
  owner: which single role owns the ship / don't ship / needs review call
Reply with only JSON: {"overall":"...","floors":"...","blockers":"...","regression":"...","reps":"...","owner":"..."}`);
    ["overall","floors","blockers","regression","reps","owner"].forEach(k=>{ if(r[k]) S.gate[k] = String(r[k]); });
    S.gateDrafted = true;
  });
}

/* ---- step 7: output ---- */
let outTab = "plan";

  ]));

  tabDefs.forEach(([k,l])=>{

  if(outTab==="cases"){

    const tw = el("div",{class:"tablewrap"}); const t = el("table");

    t.appendChild(el("thead",{},[el("tr",{},cols.map(c=>el("th",{text:c})))]));

    S.cases.forEach(c=> tb.appendChild(el("tr",{}, cols.map(k=>el("td",{text:c[k]||""})))));
    t.appendChild(tb); tw.appendChild(t); pane.appendChild(tw);
    actions(pane, [["Copy CSV", ()=>csv()],["Save test-cases.csv", ()=>({filename:"test-cases.csv", data:csv()})]]);
  }
  if(outTab==="judges"){
    if(!S.judges.length) pane.appendChild(el("div",{class:"notice",text:"No LLM judges in this eval, every criterion is graded by code, trace or human review. That's a good place to be."}));
    S.judges.forEach(j=>{
      const p = el("div",{class:"prompt"});
      p.appendChild(el("div",{class:"prompt-head"},[el("strong",{text:j.name}), el("div",{class:"btnrow"},[el("button",{class:"btn sm", onclick:e=>copy(j.prompt,e.target)},["Copy"])])]));
      p.appendChild(el("pre",{text:j.prompt}));
      pane.appendChild(p);
    });
    if(S.calibration){
      pane.appendChild(el("h4",{class:"eyebrow", style:"margin:22px 0 8px", text:"Calibrate before this gates anything"}));
      pane.appendChild(el("div",{class:"notice",text:S.calibration}));
    }
    if(S.judges.length) actions(pane, [["Copy all prompts", ()=>judgesMd()],["Save judge-prompts.md", ()=>({filename:"judge-prompts.md", data:judgesMd()})]]);
  }
  if(outTab==="calibrate"){
    pane.appendChild(el("p",{class:"hint",style:"margin-bottom:12px",text:"An afternoon of work that keeps an uncalibrated judge from silently gating your release."}));

      if(line.startsWith("### ")) doc.appendChild(el("h4",{text:line.slice(4)}));

  }
  if(outTab==="handoff"){ pane.appendChild(handoffDoc()); actions(pane, [["Copy handoff", ()=>handoffMd()]]); }

function actions(pane, list){
  const row = el("div",{class:"btnrow", style:"margin-top:20px"});
  list.forEach(([label,fn])=>{
    const isSave = label.startsWith("Save");
    if(isSave && !downloads) return;
    row.appendChild(el("button",{class:"btn" + (isSave?" primary":""), onclick: async (e)=>{
      if(isSave){
        const {filename,data} = fn();
        try{ await downloads.save({filename, data}); flash(e.target,"Saved"); }
        catch(err){ flash(e.target, err && err.code==="declined" ? "Cancelled" : "Couldn't save"); }
      } else copy(fn(), e.target);
    }},[label]));
  });
  if(!downloads) row.appendChild(el("span",{class:"hint",text:"File saving isn't available in this view, copy instead."}));
  pane.appendChild(row);
}
function copy(text, btn){
  navigator.clipboard.writeText(text).then(()=>flash(btn,"Copied")).catch(()=>flash(btn,"Press ⌘C"));
}
function flash(btn, msg){
  if(!btn) return; const old = btn.textContent; btn.textContent = msg; setTimeout(()=>{ btn.textContent = old; }, 1600);
}

function planDoc(){
  const d = el("div",{class:"doc"});
  d.appendChild(el("p",{class:"q", text:S.question||"—"}));
  const p = S.product;
  d.appendChild(el("h3",{text:"What's being evaluated"}));
  d.appendChild(el("p",{text:p.desc}));
  d.appendChild(el("ul",{},[
    li("Maturity", p.stage==="prelaunch"?"Pre-launch, cases are curated and synthetic, and do not represent production traffic":"Post-launch, cases start from real interactions"),
    li("Decision", {ship:"Ship or don't ship",compare:"Choose between versions",regress:"Catch regressions",expand:"Widen the rollout"}[p.decision]),
    li("Unit of evaluation", {response:"A single response",trajectory:"The whole trajectory",task:"Task completion",state:"Resulting state"}[p.unit]),
    p.worst ? li("Most costly failure", p.worst) : null
  ].filter(Boolean)));

  d.appendChild(el("h3",{text:"What good and bad look like"}));
  [["must","Must"],["should","Should"],["mustNot","Must not"]].forEach(([k,l])=>{
    const items = S.criteria[k].filter(c=>c.on!==false && c.text.trim());
    if(!items.length) return;
    d.appendChild(el("h4",{class:"eyebrow",text:l}));
    d.appendChild(el("ul",{}, items.map(c=>{
      const w = (k==="should" && c.weight && c.weight!=="medium") ? ` (${c.weight} priority)` : "";
      const fx = (Array.isArray(c.fromExamples) && c.fromExamples.length) ? ` (from output ${c.fromExamples.join(", ")})` : "";
      return el("li",{text:c.text + w + fx});
    })));
  });

  d.appendChild(el("h3",{text:"Test set"}));
  d.appendChild(el("p",{text:S.cases.length + " cases across " + new Set(S.cases.map(c=>c.category)).size + " categories. See the Test cases tab for the full table."}));
  if(S.notCovered) d.appendChild(el("p",{},[el("strong",{text:"Not covered: "}), S.notCovered]));

  d.appendChild(el("h3",{text:"Graders"}));
  const byType = {};
  allCriteria().forEach(c=>{ const t = (S.graders[c.id]||{}).type || "llm"; (byType[t]=byType[t]||[]).push(c.text); });
  const names = {code:"Deterministic checks",trace:"Trace checks",llm:"LLM judge",human:"Human review"};
  Object.keys(names).forEach(t=>{ if(byType[t]){ d.appendChild(el("h4",{class:"eyebrow",text:names[t]})); d.appendChild(el("ul",{}, byType[t].map(x=>el("li",{text:x})))); }});
  if(byType.llm && S.calibration) d.appendChild(el("p",{},[el("strong",{text:"Calibration: "}), S.calibration]));

  d.appendChild(el("h3",{text:"Release gate"}));
  const g = S.gate;
  const gate = el("div",{class:"gate"});
  if(g.overall) gate.appendChild(tile("Overall", g.overall));
  if(g.floors) gate.appendChild(tile("Slice floors", g.floors));
  if(g.reps) gate.appendChild(tile("Repetitions", g.reps));
  if(g.regression) gate.appendChild(tile("Permitted regression", g.regression));
  if(g.blockers) gate.appendChild(tile("Hard blockers", g.blockers, true));
  if(g.owner) gate.appendChild(tile("Decision owner", g.owner));
  d.appendChild(gate);
  return d;
}
function tile(label, val, block){
  return el("div",{class:"gate-tile" + (block?" block":"")},[el("span",{class:"eyebrow",text:label}), el("div",{class:"val", text:val})]);
}
function li(k,v){ return el("li",{},[el("strong",{text:k+": "}), v]); }

function handoffDoc(){
  const d = el("div",{class:"doc"});
  d.appendChild(el("h3",{text:"For the engineer"}));
  d.appendChild(el("p",{text:"The PM owns intended behaviour, acceptable failure, the release policy and curation of the suite. Engineering owns reliable execution, instrumentation and integration with whichever harness you use."}));
  d.appendChild(el("h4",{class:"eyebrow",text:"To build"}));
  const crits = allCriteria();
  const needs = {};
  crits.forEach(c=>{ const gr = S.graders[c.id]||{}; if(gr.evidence) needs[gr.evidence]=1; });
  d.appendChild(el("ul",{},[
    el("li",{text:"Import " + S.cases.length + " cases from test-cases.csv, including the starting state in the setup column."}),
    el("li",{text:"Implement " + crits.filter(c=>(S.graders[c.id]||{}).type==="code").length + " deterministic checks, " + crits.filter(c=>(S.graders[c.id]||{}).type==="trace").length + " trace checks and " + S.judges.length + " LLM judges."}),
    el("li",{text:"Route " + crits.filter(c=>(S.graders[c.id]||{}).type==="human").length + " criteria to human review."}),
    el("li",{text:"Encode the hard blockers as gates that fail the run outright, never averaged into a score."}),
    S.gate.reps ? el("li",{text:"Repetitions: " + S.gate.reps}) : null,
    el("li",{text:"Separate infrastructure failures from product failures in the report; an errored run is inconclusive, not a pass."})
  ].filter(Boolean)));
  if(Object.keys(needs).length){
    d.appendChild(el("h4",{class:"eyebrow",text:"Instrumentation the graders need to see"}));
    d.appendChild(el("ul",{}, Object.keys(needs).map(n=>el("li",{text:n}))));
  }
  if(S.judges.length){
    d.appendChild(el("h4",{class:"eyebrow",text:"How to run the LLM judges"}));
    d.appendChild(el("ul",{},[
      el("li",{text:"Run each criterion as its own judge call, one prompt per criterion. Models get lazy and wash out specifics when several criteria share a prompt."}),
      el("li",{text:"Aggregate the results into a case-by-criterion sheet (pass/fail plus one-line reason). That's your review artefact, not a headline score."}),
      el("li",{text:"Treat any must-not (hard blocker) as a gate on its own row, not something an average can absorb."}),
      el("li",{text:"Auto-eval tools recover obvious errors well but miss product-judgement failures and typically run 80–90% precise. Sample the judge's passes and failures by hand before trusting the aggregate."})
    ]));
  }
  const anyProvenance = allCriteria().some(c=>Array.isArray(c.fromExamples) && c.fromExamples.length);
  if((S.product.escalation||"").trim()){
    d.appendChild(el("h4",{class:"eyebrow",text:"Actions that need human approval"}));
    d.appendChild(el("p",{text:S.product.escalation}));
    d.appendChild(el("ul",{},[
      el("li",{text:"Enforce these in code, at the point the action is taken, not in the prompt. A prompt instruction is a request; an authorisation check is a guarantee."}),
      el("li",{text:"Assume the model can be talked into trying. There is no reliable detector for a determined prompt injection, so the approval step has to hold even when the model has been convinced it should not."}),
      el("li",{text:"Add a case that tries to get the action taken without approval, and treat a pass as a hard blocker rather than a score."})
    ]));
  }
  d.appendChild(el("h4",{class:"eyebrow",text:"Do not guess these"}));
  d.appendChild(el("ul",{},[
    el("li",{text:"Any threshold left blank in the release gate, ask the PM."}),
    S.product.stage==="prelaunch" ? el("li",{text:"These cases are curated, not sampled from production. Replace them with real traffic as soon as there is any."}) : null,
    anyProvenance ? el("li",{text:"Criteria tagged \"from output N\" came from the PM reviewing specific real outputs. Preserve the reference when you cite them in a report; it's the shortest path back to the failure they're catching."}) : null,
    S.judges.length ? el("li",{text:"No judge score gates a release until it has been calibrated against hand labels."}) : null
  ].filter(Boolean)));
  d.appendChild(el("h4",{class:"eyebrow",text:"Next three actions"}));
  d.appendChild(el("ul",{},[
    el("li",{text:"Run the set by hand once, on today's version, and read every failure yourself."}),
    el("li",{text:"Label a mixed calibration set and check the judges against it before wiring the gate."}),
    el("li",{text:"Put the run behind whatever triggers your release, and make each new production failure a new case."})
  ]));
  d.appendChild(el("h4",{class:"eyebrow",text:"When a new model ships"}));
  d.appendChild(el("ul",{},[
    el("li",{text:"Keep each configuration you care about (model, prompt, tools) stored as a config you can re-run, not as a thing someone changed by hand."}),
    el("li",{text:"When a new model lands, re-run this whole suite against it rather than trusting the benchmark scores in the announcement. Your eval is the only one measuring your product."}),
    el("li",{text:"Then decide deliberately what to deploy, what to keep as a fallback, and what to retire. A model that is better on average can still be worse on the slice you care about."})
  ]));
  if(S.product.stage==="prelaunch"){
    d.appendChild(el("h4",{class:"eyebrow",text:"Before this takes real traffic"}));
    d.appendChild(el("ul",{},[
      el("li",{text:"Make sure the evidence each grader needs is actually recorded from day one. If you cannot see what the system was given, which tools it called and what came back, you cannot evaluate it later, and retrofitting that is far more expensive than building it in now."})
    ]));
  }
  return d;
}

function planMd(){
  const p = S.product, g = S.gate, L = [];
  L.push("# Eval plan\n");
  L.push("**Evaluation question**\n\n> " + (S.question||"—") + "\n");
  L.push("## What's being evaluated\n\n" + p.desc + "\n");
  L.push("- Maturity: " + (p.stage==="prelaunch"?"Pre-launch, curated and synthetic cases; these do not represent production traffic":"Post-launch, cases start from real interactions"));
  L.push("- Decision: " + {ship:"Ship or don't ship",compare:"Choose between versions",regress:"Catch regressions",expand:"Widen the rollout"}[p.decision]);
  L.push("- Unit of evaluation: " + {response:"A single response",trajectory:"The whole trajectory",task:"Task completion",state:"Resulting state"}[p.unit]);
  if(p.worst) L.push("- Most costly failure: " + p.worst);
  if((p.escalation||"").trim()) L.push("- Requires human approval: " + p.escalation.trim());
  if((S.taxonomy||[]).length){
    const nRev = reviewedTotal();
    L.push("\n## Failure modes observed\n");
    L.push("Grouped from a review of " + nRev + " real outputs. These describe what goes wrong; the criteria below are the rules that catch them.\n");
    S.taxonomy.forEach(m=>{
      const seen = (m.outputs||[]).length;
      L.push("**" + m.name + "**" + (seen ? ` _(seen in ${seen} of ${nRev})_` : ""));
      if(m.definition) L.push(m.definition);
      L.push("");
    });
  }
  L.push("\n## Criteria\n");
  [["must","Must"],["should","Should"],["mustNot","Must not"]].forEach(([k,l])=>{
    const it = S.criteria[k].filter(c=>c.on!==false && c.text.trim());
    if(!it.length) return;
    L.push("### " + l + "\n"); it.forEach(c=>{
      const w = (k==="should" && c.weight && c.weight!=="medium") ? ` _(${c.weight} priority)_` : "";
      const fx = (Array.isArray(c.fromExamples) && c.fromExamples.length) ? ` _(from output ${c.fromExamples.join(", ")})_` : "";
      const nRev = reviewedTotal();
      const pv = (Array.isArray(c.failedIn) && c.failedIn.length && nRev)
        ? ` _(failed ${c.failedIn.length} of ${nRev} reviewed, likely ${pct(wilson(c.failedIn.length,nRev)[0])} to ${pct(wilson(c.failedIn.length,nRev)[1])} of traffic)_` : "";
      L.push("- " + c.text + w + fx + pv);
    }); L.push("");
  });
  L.push("## Test set\n\n" + S.cases.length + " cases, see test-cases.csv.");
  if(S.notCovered) L.push("\n**Not covered:** " + S.notCovered);
  L.push("\n## Graders\n");
  allCriteria().forEach(c=>{ const gr = S.graders[c.id]||{}; L.push("- [" + (GRADER_SCHEMA[gr.type||"llm"]) + "] " + c.text + (gr.evidence?", needs: "+gr.evidence:"")); });
  if(S.calibration) L.push("\n**Calibration:** " + S.calibration);
  L.push("\n## Release gate\n");
  [["Overall",g.overall],["Slice floors",g.floors],["Hard blockers",g.blockers],["Permitted regression",g.regression],["Repetitions",g.reps],["Decision owner",g.owner]].forEach(([k,v])=>{ if(v) L.push("- **"+k+":** " + v); });
  return L.join("\n");
}
function csv(){
  const q = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
  const join = xs => xs.filter(x=>String(x||"").trim()).join("; ");
  const byKind = k => allCriteria().filter(c=>c.kind===k).map(c=>c.text);

  const musts = byKind("must"), shoulds = byKind("should"), mustNots = byKind("must not");
  const blockers = String(S.gate.blockers||"").split("\n").map(x=>x.trim()).filter(Boolean);
  const graders = [...new Set(allCriteria().map(c=>GRADER_SCHEMA[(S.graders[c.id]||{}).type||"llm"]))];
  // gate.reps is free text ("3", "3 for critical cases"); the schema wants a positive integer.
  const repsMatch = String(S.gate.reps||"").match(/\d+/);
  const reps = repsMatch && +repsMatch[0] > 0 ? +repsMatch[0] : 1;
  const gradersChosen = !!S.gradersDrafted || allCriteria().some(c=>!!S.graders[c.id]);

  // Every case the wizard produces is deliberately chosen, never sampled traffic, so it
  // is "curated" even when it was written from a real output. Saying "production" here
  // would let curated cases pose as production traffic.
  const rows = [CSV_COLS.join(",")];
  S.cases.forEach(c=>{
    const required = join(musts.length ? musts : shoulds) || String(c.expected||"");
    const filled = String(c.name||"").trim() && String(c.input||"").trim() && String(c.expected||"").trim();
    // Every criterion falls back to an LLM judge in the UI, so an untouched step 5 means
    // the graders were defaulted, not chosen. Say so rather than calling the row ready.
    const status = !(musts.length || shoulds.length) ? "needs_product_decision"
                 : !filled ? "needs_evidence"
                 : !gradersChosen ? "needs_grader"
                 : "ready";
    rows.push([
      c.id, c.name, c.category, PRIORITY_BY_CAT[c.category] || "medium", "curated", c.slice||"",
      c.input, c.setup, c.expected,
      required, join(mustNots.concat(blockers)), "",
      join(graders), reps, status, c.why||""
    ].map(q).join(","));
  });
  return rows.join("\n");
}
function judgesMd(){
  const L = ["# Judge prompts\n","These are drafts. Calibrate each against hand labels before any of them gates a release. See calibrate.md.\n"];
  S.judges.forEach(j=>{ L.push("## " + j.name + "\n"); L.push("```\n" + j.prompt + "\n```\n"); });
  if(S.calibration) L.push("## Calibration notes\n\n" + S.calibration);
  return L.join("\n");
}
function calibrateMd(){
  const L = [];
  L.push("# Calibrate the judges before they gate anything\n");
  L.push("An uncalibrated LLM judge is a coin flip in a lab coat. Before you let any judge score decide ship or hold, check it agrees with a human on real examples. This takes an afternoon.\n");
  L.push("## 1. Build a mixed calibration set (about 20 examples)\n");
  L.push("Pick outputs that cover the full picture, not just the middle:");
  L.push("- Clear passes, the feature working as intended");
  L.push("- Clear failures, the kind of thing you'd screenshot to your team");
  L.push("- Boundary cases, where you can see the argument for either verdict");
  L.push("- Adversarial or unusual inputs, the ones your test set is stretching to cover");
  L.push("- Insufficient-evidence cases, where a reasonable judge would say \"can't tell\"\n");
  L.push("Prefer real outputs over synthetic ones. If you have none yet, note that these labels are on drafts and must be redone with production traffic.\n");
  L.push("## 2. Label each output by hand, without seeing the judge's answer\n");
  L.push("For each criterion, mark pass or fail and write a one-line reason. Two reviewers on the same subset is better than one; disagreements tell you the criterion is ambiguous.\n");
  L.push("## 3. Run each judge on the same set\n");
  S.judges.forEach(j=>{ L.push("- " + j.name); });
  if(!S.judges.length) L.push("- (No LLM judges in this eval yet.)");
  L.push("\n## 4. Compare, and look at the disagreements\n");
  L.push("Don't just report a headline accuracy. Split it:");
  L.push("- **False passes**, judge said pass, human said fail. Read every one; these are the ones that ship bad output to users.");
  L.push("- **False failures**, judge said fail, human said pass. These annoy the team and erode trust in the eval.\n");
  L.push("## 5. Fix the right thing\n");
  L.push("When agreement is weak, resist the urge to just move the threshold. In order:");
  L.push("1. Is the criterion itself ambiguous? Rewrite it so two humans would agree.");
  L.push("2. Is the judge missing evidence it needs? Give it the trace field, the source doc, the prior turn.");
  L.push("3. Is the prompt vague? Show the judge two labelled examples (one pass, one fail) and the reasoning.");
  L.push("4. Only then adjust the threshold. Never present an uncalibrated judge score as ground truth.\n");
  L.push("## 6. Keep held-out examples, and only read them once\n");
  L.push("The examples you used to tune the judge shouldn't be the ones you measure it on. Split your labelled set: work on one half, and set the other aside as a held-out check.\n");
  L.push("The discipline that makes this worth anything: you read the held-out set **once**, when you think you are finished. The moment you look at it and then go back and tweak the judge, it has stopped being held-out and has quietly become part of your tuning set. If you need another look, label fresh examples for it.\n");
  L.push("## 7. Route uncertainty to humans\n");
  L.push("Whatever the judge can't decide confidently should go to a human, not a default pass. Log those cases; they're your next round of criteria.\n");
  if(S.calibration){ L.push("## Notes from this eval\n\n" + S.calibration); }
  return L.join("\n");
}
function handoffMd(){
  const d = handoffDoc();
  const L = ["# Engineering handoff\n"];
  Array.from(d.children).forEach(n=>{
    const tag = n.tagName;
    if(tag==="H3") L.push("\n## " + n.textContent + "\n");
    else if(tag==="H4") L.push("\n**" + n.textContent + "**\n");
    else if(tag==="UL") Array.from(n.children).forEach(li=>L.push("- " + li.textContent));
    else L.push(n.textContent);
  });
  return L.join("\n");
}

/* ============================ field builders ============================ */
function field(label, hint, control, badge){
  const f = el("div",{class:"field"});
  const head = el("div",{class:"field-head"},[el("label",{class:"lbl",text:label})]);
  if(badge==="you") head.appendChild(el("span",{class:"badge you",text:"needs you"}));
  if(badge==="drafted") head.appendChild(el("span",{class:"badge drafted",text:"drafted, review"}));
  if(badge==="example") head.appendChild(el("span",{class:"badge example",text:"example"}));
  f.appendChild(head);
  if(hint) f.appendChild(el("p",{class:"hint",text:hint}));
  f.appendChild(control);
  return f;
}
function area(value, onchange, rows, placeholder){
  const t = el("textarea",{rows:rows||2, placeholder:placeholder||""});
  t.value = value||"";
  t.addEventListener("input", ()=> onchange(t.value));
  bindArea(t);
  return t;
}
function pick(label, hint, options, current, onchange){
  const f = el("div",{class:"field"});
  f.appendChild(el("div",{class:"field-head"},[el("label",{class:"lbl",text:label})]));
  if(hint) f.appendChild(el("p",{class:"hint",text:hint}));
  const row = el("div",{class:"choices"});
  options.forEach(([v,l,s])=>{
    const b = el("button",{class:"choice","aria-pressed": current===v?"true":"false", onclick:()=>{ onchange(v); render(); }},[
      el("span",{text:l}), s?el("small",{text:s}):el("span")
    ]);
    row.appendChild(b);
  });
  f.appendChild(row);
  return f;
}
